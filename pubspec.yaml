name: movies
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_route: ^11.1.0
  shared_preferences: ^2.5.5
  flutter_gen: ^5.15.0
  font_awesome_flutter: ^11.0.0
  flutter_screenutil_plus: ^1.6.0
  intl: ^0.20.2
  cached_network_image_ce: ^4.10.0
  flutter_bloc: ^9.1.1
  country_code_picker: ^3.4.1
  pin_code_fields: ^9.4.0
  carousel_slider: ^5.1.2
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  dio: ^5.11.1
  retrofit: ^4.10.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.0.0
  retrofit_generator: ^10.2.9
  json_serializable: ^6.11.1
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0


flutter_gen:
  output: lib/generated/assets
  line_length: 80

  integrations:
    flutter_svg: true



flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/png/
    - assets/images/svg/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100

        - asset: assets/fonts/Roboto-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300

        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400

        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500

        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 600

        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 700

        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900

